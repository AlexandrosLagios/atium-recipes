services:
  recipebot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${OAUTH_CALLBACK_PORT:-8080}:${OAUTH_CALLBACK_PORT:-8080}"
    volumes:
      - recipebot-data:/data
    networks:
      - internal

volumes:
  recipebot-data:

networks:
  internal:
    external: true
